seed: 42
task_name: dsp-dior
ckpt_dir: ./ckpt
accelerator:
  gradient_accumulation_steps: 80
  mixed_precision: 'no'
  report_to: tensorboard
model:
  name: dsp
  sd15_weight_path: ./pretrained/stable-diffusion-v1-5
  clip_weight_path: ./pretrained/clip-vit-large-patch14
  dinov2_vitl14_path: ./pretrained/dinov2_vitl14_pretrain.pth
  clip_vit_b16_path: ./pretrained/ViT-B-16.pt
  exemplar_pool:
    data_embeds_dict_path: ./data/DIOR/dior_emb.pt
    exemplar_pool_path: ./data/DIOR/images
  image_proj_model:
    dim: 1280
    depth: 4
    dim_head: 64
    num_queries: [16, 8, 8]
    ff_mult: 4
dataset:
  name: dior
  config: default
  resolution: 512
  ref_resolution: 224
  categories:
    all: [
      vehicle, baseballfield, groundtrackfield, windmill, bridge, 
      overpass, ship, airplane, tenniscourt, airport, 
      expressway-service-area, basketballcourt, stadium, storagetank, chimney, 
      dam, expressway-toll-station, golffield, trainstation, harbor
    ]
    base: [
      vehicle, baseballfield, groundtrackfield, bridge, overpass, 
      ship, airplane, tenniscourt, expressway-service-area, basketballcourt, 
      stadium, storagetank, expressway-toll-station, golffield, harbor
    ]
    novel: [windmill, airport, chimney, dam, trainstation]
  data_files:
    train:
      base:
        default: ./data/DIOR/metadatas/data_setting1/train_base.jsonl
      novel:
        airport: ./data/DIOR/metadatas/data_setting1/train_novel_airport.jsonl
        chimney: ./data/DIOR/metadatas/data_setting1/train_novel_chimney.jsonl
        dam: ./data/DIOR/metadatas/data_setting1/train_novel_dam.jsonl
        trainstation: ./data/DIOR/metadatas/data_setting1/train_novel_trainstation.jsonl
        windmill: ./data/DIOR/metadatas/data_setting1/train_novel_windmill.jsonl
    infer:
      base:
        default: ./data/DIOR/metadatas/data_setting1/test_base.jsonl
      novel:
        airport: ./data/DIOR/metadatas/data_setting1/test_novel_airport.jsonl
        chimney: ./data/DIOR/metadatas/data_setting1/test_novel_chimney.jsonl
        dam: ./data/DIOR/metadatas/data_setting1/test_novel_dam.jsonl
        trainstation: ./data/DIOR/metadatas/data_setting1/test_novel_trainstation.jsonl
        windmill: ./data/DIOR/metadatas/data_setting1/test_novel_windmill.jsonl
  column_names: [image, captions, bndboxes, obboxes]
  novel_settings:
    k_shot: 5
    shuffle_seed: 42
  image_patch_path: ./data/DIOR/patches
  transform: LayoutTransform
training:
  entry: train_dsp
  optimizer:
    name: AdamWGating
    learning_rate: 1.e-4
    weight_decay: 1.e-2
    adam_beta: [0.9, 0.999]
    adam_epsilon: 1.e-08
  scheduler:
    lr_scheduler: constant
    lr_warmup_steps: 0
  batch_size: 1
  num_workers: 0
  noise_offset: 0
  input_perturbation: 0
  prediction_type: null
  max_grad_norm: 1.
  base:
    num_train_epochs: 100
    max_train_steps: null
    ckpt_interval_steps: 1200
  novel:
    num_train_epochs: null
    max_train_steps: 100
    ckpt_interval_steps: 100
    base_ckpt_steps: 1200
inference:
  entry: infer_dsp
  output_dir: ./outputs
  seed: 42
  base:
    ckpt_steps: 1200
  novel:
    ckpt_steps: 100