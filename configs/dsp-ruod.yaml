seed: 42
task_name: dsp-ruod
ckpt_dir: ./ckpt
accelerator:
  gradient_accumulation_steps: 80
  mixed_precision: 'no'
  report_to: tensorboard
model:
  name: dsp
  sd15_weight_path: ./pretrained/stable-diffusion-v1-5
  clip_weight_path: ./pretrained/clip-vit-large-patch14
  dinov2_vitl14_path: ./pretrained/dinov2_vitl14_pretrain.pth
  clip_vit_b16_path: ./pretrained/ViT-B-16.pt
  exemplar_pool:
    data_embeds_dict_path: ./data/RUOD/ruod_emb.pt
    exemplar_pool_path: ./data/RUOD/images/train
  image_proj_model:
    dim: 1280
    depth: 4
    dim_head: 64
    num_queries: [16, 8, 8]
    ff_mult: 4
dataset:
  name: dior
  config: default
  resolution: 512
  ref_resolution: 224
  categories:
    all: [
      holothurian, echinus, scallop, starfish, fish, 
      corals, diver, cuttlefish, turtle, jellyfish, 
    ]
    base: [holothurian, echinus, scallop, starfish, fish, diver]
    novel: [corals, cuttlefish, turtle, jellyfish]
  data_files:
    train:
      base:
        default: ./data/RUOD/metadatas/data_setting1/train_base.jsonl
      novel:
        corals: ./data/RUOD/metadatas/data_setting1/train_novel_corals.jsonl
        cuttlefish: ./data/RUOD/metadatas/data_setting1/train_novel_cuttlefish.jsonl
        turtle: ./data/RUOD/metadatas/data_setting1/train_novel_turtle.jsonl
        jellyfish: ./data/RUOD/metadatas/data_setting1/train_novel_jellyfish.jsonl
    infer:
      base:
        default: ./data/RUOD/metadatas/data_setting1/test_base.jsonl
      novel:
        corals: ./data/RUOD/metadatas/data_setting1/test_novel_corals.jsonl
        cuttlefish: ./data/RUOD/metadatas/data_setting1/test_novel_cuttlefish.jsonl
        turtle: ./data/RUOD/metadatas/data_setting1/test_novel_turtle.jsonl
        jellyfish: ./data/RUOD/metadatas/data_setting1/test_novel_jellyfish.jsonl
  column_names: [image, captions, bndboxes, obboxes]
  novel_settings:
    k_shot: 5
    shuffle_seed: 42
  image_patch_path: ./data/RUOD/patches
  transform: LayoutTransform
training:
  entry: train_dsp
  optimizer:
    name: AdamWGating
    learning_rate: 1.e-4
    weight_decay: 1.e-2
    adam_beta: [0.9, 0.999]
    adam_epsilon: 1.e-08
  scheduler:
    lr_scheduler: constant
    lr_warmup_steps: 0
  batch_size: 1
  num_workers: 0
  noise_offset: 0
  input_perturbation: 0
  prediction_type: null
  max_grad_norm: 1.
  base:
    num_train_epochs: 100
    max_train_steps: null
    ckpt_interval_steps: 1200
  novel:
    num_train_epochs: null
    max_train_steps: 100
    ckpt_interval_steps: 100
    base_ckpt_steps: 1200
inference:
  entry: infer_dsp
  output_dir: ./outputs
  seed: 42
  base:
    ckpt_steps: 1200
  novel:
    ckpt_steps: 100